services:
  # ── Python live feed: Upstox WebSocket → Redis Stream alpha:ticks ────────────
  data-feed:
    build:
      context: .
      dockerfile: services/data_feed/Dockerfile
    image: alpha-data-feed:latest
    container_name: alpha-data-feed
    restart: unless-stopped
    environment:
      - TZ=Asia/Kolkata
      - MODE=live
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=alpha_db
      - POSTGRES_USER=alpha_user
      - POSTGRES_PASSWORD=alpha_password
      # Top 5 NSE large-cap liquid stocks
      - INGEST_SYMBOLS=NSE_EQ|INE002A01018,NSE_EQ|INE467B01029,NSE_EQ|INE040A01034,NSE_EQ|INE009A01021,NSE_EQ|INE090A01021
    env_file:
      - .env
    depends_on:
      - redis
      - postgres-db
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ── Python historical feed: Upstox REST → QuestDB ILP (run-to-completion) ───
  data-feed-historical:
    build:
      context: .
      dockerfile: services/data_feed/Dockerfile
    image: alpha-data-feed:latest
    container_name: alpha-data-feed-historical
    restart: "no"
    environment:
      - TZ=Asia/Kolkata
      - MODE=historical
      - POSTGRES_HOST=postgres-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=alpha_db
      - POSTGRES_USER=alpha_user
      - POSTGRES_PASSWORD=alpha_password
      - QUESTDB_HOST=questdb
      - QUESTDB_ILP_PORT=9009
      - BACKFILL_INTERVAL=1minute
      - BACKFILL_FROM_DATE=2024-01-01
      # BACKFILL_TO_DATE defaults to today
    env_file:
      - .env
    depends_on:
      - postgres-db
      - questdb
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ── C++ ingester: Redis Stream alpha:ticks → SHM ring buffer ─────────────────
  ingester:
    build:
      context: .
      dockerfile: services/ingester/Dockerfile
    image: alpha-ingester:latest
    container_name: alpha-ingester
    restart: unless-stopped
    ports:
      - "9002:9000"
    environment:
      - TZ=Asia/Kolkata
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    # ipc: host is required for ultra-low latency shared memory IPC
    ipc: host
    depends_on:
      - redis
      - data-feed
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M

  questdb:
    build:
      context: ./infra/questdb
      dockerfile: Dockerfile
    image: alpha-questdb:latest
    container_name: alpha-questdb
    restart: unless-stopped
    ports:
      - "9000:9000"  # Web Console
      - "9009:9009"  # ILP (TCP)
      - "8812:8812"  # Postgres Wire Protocol
    environment:
      - QDB_TELEMETRY_ENABLED=false
    volumes:
      - alpha_questdata:/var/lib/questdb

  postgres-db:
    build:
      context: ./infra/postgres
      dockerfile: Dockerfile
    image: alpha-postgres:latest
    container_name: alpha-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=alpha_db
      - POSTGRES_USER=alpha_user
      - POSTGRES_PASSWORD=alpha_password
    volumes:
      - alpha_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  pgadmin:
    image: dpage/pgadmin4
    container_name: alpha-pgadmin
    restart: unless-stopped
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@alpha.hft
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    depends_on:
      - postgres-db

  worker-service:
    build:
      context: .
      dockerfile: services/worker_service/Dockerfile
    image: alpha-worker-service:latest
    container_name: alpha-worker-service
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - TZ=Asia/Kolkata
      - POSTGRES_HOST=postgres-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=alpha_db
      - POSTGRES_USER=alpha_user
      - POSTGRES_PASSWORD=alpha_password
      - TEST_MODE=1
    depends_on:
      - postgres-db

  signal-engine:
    build:
      context: .
      dockerfile: services/signal_engine/Dockerfile
    image: alpha-signal-engine:latest
    container_name: alpha-signal-engine
    restart: unless-stopped
    environment:
      - TZ=Asia/Kolkata
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - alpha_secrets:/app/secrets
    # Mapped directly to the host's /dev/shm space for sub-microsecond IPC with Ingester
    ipc: host
    depends_on:
      - redis
      - ingester
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G

  strategy-engine:
    build:
      context: .
      dockerfile: services/strategy_engine/Dockerfile
    image: alpha-strategy-engine:latest
    container_name: alpha-strategy-engine
    restart: unless-stopped
    environment:
      - TZ=Asia/Kolkata
      - TEST_MODE=1  # Bypasses market-hours gate; remove in production
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    # Mapped directly to the host's /dev/shm space for sub-microsecond IPC with signal engine
    ipc: host
    depends_on:
      - signal-engine
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  market-engine:
    build:
      context: .
      dockerfile: services/market_engine/Dockerfile
    image: alpha-market-engine:latest
    container_name: alpha-market-engine
    restart: unless-stopped
    environment:
      - TZ=Asia/Kolkata
      - STARTING_CAPITAL=1000000   # ₹10,00,000 starting paper capital
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    # ipc: host required to read from alpha_order_shm_v1 (written by strategy-engine)
    ipc: host
    depends_on:
      - strategy-engine
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M

  redis:
    build:
      context: ./infra/redis
      dockerfile: Dockerfile
    image: alpha-redis:latest
    container_name: alpha-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      - TZ=Asia/Kolkata
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - redis_data:/data

  backfill-engine:
    build:
      context: .
      dockerfile: services/backfill_engine/Dockerfile
    image: alpha-backfill-engine:latest
    container_name: alpha-backfill-engine
    restart: "no"  # Run-to-completion job, not a daemon
    environment:
      - TZ=Asia/Kolkata
      - POSTGRES_HOST=postgres-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=alpha_db
      - POSTGRES_USER=alpha_user
      - POSTGRES_PASSWORD=alpha_password
      - QUESTDB_HOST=questdb
      - QUESTDB_ILP_PORT=9009
      # Backfill range — override via docker-compose run or .env
      - BACKFILL_INTERVAL=1minute
      - BACKFILL_FROM_DATE=2024-01-01
      # BACKFILL_TO_DATE defaults to today
    env_file:
      - .env
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    depends_on:
      - postgres-db
      - questdb
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  backtest-engine:
    build:
      context: .
      dockerfile: services/backtest_engine/Dockerfile
    image: alpha-backtest-engine:latest
    container_name: alpha-backtest-engine
    restart: "no"  # Run-to-completion job
    environment:
      - TZ=Asia/Kolkata
      - QUESTDB_HOST=questdb
      - BACKTEST_DATA_DIR=/data/backtest
      - STARTING_CAPITAL=1000000
      - BROKERAGE_FLAT=20
      - SLIPPAGE_BPS=2
      - BATCH_SIZE=1024
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - alpha_backtest_data:/data/backtest
    depends_on:
      - questdb
    deploy:
      resources:
        limits:
          cpus: '4.0'    # Maximize CPU for hot-loop
          memory: 4G     # Large page cache for mmap

  # ── Terminal UI — interactive operator dashboard ────────────────────────────
  tui:
    build:
      context: .
      dockerfile: services/tui/Dockerfile
    image: alpha-tui:latest
    container_name: alpha-tui
    restart: "no"
    stdin_open: true   # Required for interactive TUI
    tty: true          # Allocate pseudo-TTY
    environment:
      - TZ=Asia/Kolkata
      - TERM=xterm-256color
      - COLORTERM=truecolor
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres-db
      - QUESTDB_HOST=questdb
      - DOCKER_NETWORK=alpha_default
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Docker API access
    depends_on:
      - redis
      - postgres-db
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

volumes:
  redis_data:
  alpha_secrets:
  alpha_pgdata:
  alpha_questdata:
  alpha_backtest_data:

