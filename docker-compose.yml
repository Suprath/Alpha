services:
  ingester:
    build:
      context: .
      dockerfile: services/ingester/Dockerfile
    image: alpha-ingester:latest
    container_name: alpha-ingester
    restart: unless-stopped
    ports:
      - "9002:9000"
    environment:
      - TZ=Asia/Kolkata
      - POSTGRES_HOST=postgres-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=alpha_db
      - POSTGRES_USER=alpha_user
      - POSTGRES_PASSWORD=alpha_password
      - QUESTDB_HOST=questdb
      - QUESTDB_ILP_PORT=9009
    env_file:
      - .env
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - alpha_secrets:/app/secrets
    # ipc: host is required for ultra-low latency shared memory IPC later
    ipc: host
    depends_on:
      - redis
      - postgres-db
      - questdb
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  questdb:
    build:
      context: ./infra/questdb
      dockerfile: Dockerfile
    image: alpha-questdb:latest
    container_name: alpha-questdb
    restart: unless-stopped
    ports:
      - "9000:9000"  # Web Console
      - "9009:9009"  # ILP (TCP)
      - "8812:8812"  # Postgres Wire Protocol
    environment:
      - QDB_TELEMETRY_ENABLED=false
    volumes:
      - alpha_questdata:/var/lib/questdb

  postgres-db:
    build:
      context: ./infra/postgres
      dockerfile: Dockerfile
    image: alpha-postgres:latest
    container_name: alpha-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=alpha_db
      - POSTGRES_USER=alpha_user
      - POSTGRES_PASSWORD=alpha_password
    volumes:
      - alpha_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  pgadmin:
    image: dpage/pgadmin4
    container_name: alpha-pgadmin
    restart: unless-stopped
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@alpha.hft
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    depends_on:
      - postgres-db

  worker-service:
    build:
      context: .
      dockerfile: services/worker_service/Dockerfile
    image: alpha-worker-service:latest
    container_name: alpha-worker-service
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - TZ=Asia/Kolkata
      - POSTGRES_HOST=postgres-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=alpha_db
      - POSTGRES_USER=alpha_user
      - POSTGRES_PASSWORD=alpha_password
      - TEST_MODE=1
    depends_on:
      - postgres-db

  signal-engine:
    build:
      context: .
      dockerfile: services/signal_engine/Dockerfile
    image: alpha-signal-engine:latest
    container_name: alpha-signal-engine
    restart: unless-stopped
    environment:
      - TZ=Asia/Kolkata
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - alpha_secrets:/app/secrets
    # Mapped directly to the host's /dev/shm space for sub-microsecond IPC with Ingester
    ipc: host
    depends_on:
      - redis
      - ingester
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G

  redis:
    build:
      context: ./infra/redis
      dockerfile: Dockerfile
    image: alpha-redis:latest
    container_name: alpha-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      - TZ=Asia/Kolkata
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - redis_data:/data

volumes:
  redis_data:
  alpha_secrets:
  alpha_pgdata:
  alpha_questdata:

